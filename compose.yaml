services:
  db_sbgb:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-sbgb_user}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-sbgb_password}
      POSTGRES_DB: ${SPRING_DATASOURCE_DB:-db-sbgb}
    ports:
      - 5432:5432
    volumes:
      - db_sbgb-data:/var/lib/postgresql/data

volumes:
  db_sbgb-data: